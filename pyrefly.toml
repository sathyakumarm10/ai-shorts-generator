# Pyrefly Language Server Configuration

[tool.pyrefly]
project-includes = ["backend/**/*.py", "tests/**/*.py"]
project-excludes = [
    "**/venv/**",
    "**/node_modules/**",
    "**/__pycache__/**",
    "**/.git/**",
    "**/dist/**"
]

search-path = ["backend"]

python-interpreter-path = "backend/venv/Scripts/python.exe"

python-version = "3.14"
python-platform = "windows"
