# ==============================================================================
# AI Shorts Generator - Production Docker Compose Stack
# ------------------------------------------------------------------------------
# Usage:
#   docker compose up -d --build
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Backend API & Video Processing Engine (FastAPI + FFmpeg + Whisper)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ai_shorts_backend
    restart: unless-stopped
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET:-dev-insecure-secret-key-change-in-production-1234567890}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - PBKDF2_ITERATIONS=${PBKDF2_ITERATIONS:-100000}
      - JOB_DB_PATH=/app/data/jobs.sqlite3
      - USER_DB_PATH=/app/data/users.sqlite3
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AI_API_BASE=${AI_API_BASE:-https://openrouter.ai/api/v1}
      - AI_MODEL=${AI_MODEL:-openai/gpt-4o-mini}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_BUCKET=${S3_BUCKET:-ai-shorts-bucket}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_PUBLIC_BASE_URL=${S3_PUBLIC_BASE_URL:-}
      - HF_HOME=/app/model_cache
    volumes:
      # Persistent SQLite databases (jobs & users)
      - ai_shorts_data:/app/data
      # Persistent generated shorts media outputs
      - ai_shorts_outputs:/app/outputs
      # Persistent uploaded and ingested source videos
      - ai_shorts_downloads:/app/downloads
      # Persistent cache for speech-to-text AI model weights
      - ai_shorts_models:/app/model_cache
    expose:
      - "8000"
    networks:
      - ai_shorts_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # Frontend Web Interface & Reverse Proxy (React SPA + Nginx)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ai_shorts_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ai_shorts_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

# ------------------------------------------------------------------------------
# Persistent Named Volumes
# ------------------------------------------------------------------------------
volumes:
  ai_shorts_data:
    name: ai_shorts_data
  ai_shorts_outputs:
    name: ai_shorts_outputs
  ai_shorts_downloads:
    name: ai_shorts_downloads
  ai_shorts_models:
    name: ai_shorts_models

# ------------------------------------------------------------------------------
# Isolated Internal Bridge Network
# ------------------------------------------------------------------------------
networks:
  ai_shorts_network:
    name: ai_shorts_network
    driver: bridge
