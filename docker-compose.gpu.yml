# ==============================================================================
# AI Shorts Generator - GPU Accelerated Docker Compose Override
# ------------------------------------------------------------------------------
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
# ==============================================================================

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.gpu
    environment:
      - ACCELERATION_DEVICE=${ACCELERATION_DEVICE:-auto}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-auto}
      - WHISPER_COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-auto}
      - FFMPEG_ACCELERATION=${FFMPEG_ACCELERATION:-auto}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
